<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================== Favicon / App Icons ===================== -->
    <!-- Classic ICO – browsers that don't support PNG favicons -->
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
    <!-- SVG favicon – modern browsers (scalable, theme-aware) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- PNG favicons for standard browsers -->
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png" />
    <!-- Apple Touch Icon – iOS home screen / Safari -->
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
    <!-- Web App Manifest – Android / PWA -->
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
    <!-- Theme color – browser address-bar tint (Android Chrome, Safari 15+) -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Microsoft Tiles (Windows Start tiles / IE11 pinned sites) -->
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="/images/favicon/android-chrome-192x192.png" />
    <!-- ============================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <title>Opulenza</title>
  </head>

  </body>
</html>
